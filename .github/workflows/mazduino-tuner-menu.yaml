name: Mazduino Tuner menu

# Validate the Mazduino Tuner menu layout and its committed output for all boards.
# Does not build firmware and does not publish anything (nightly-release.yaml publishes the menus).

on:
  push:
    branches: [mazduino-tuner]
    paths:
      - 'mazduino-tuner/**'
      - 'boards/**'
      - '.github/workflows/mazduino-tuner-menu.yaml'
  pull_request:
    paths:
      - 'mazduino-tuner/**'
      - 'boards/**'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      # Regenerates from the INI each committed menu was built from, so only a layout or generator
      # change committed without regenerating can fail this.
      - name: Check committed output matches the layout
        run: |
          chmod +x mazduino-tuner/tools/*.sh
          mazduino-tuner/tools/check_generated.sh

      - name: Generate menu for all boards
        run: mazduino-tuner/tools/gen_all_from_gh_pages.sh master

      # A newer nightly INI is expected to differ: it only means a regenerate is due.
      - name: Report changes from the latest nightly INI
        run: |
          if ! git diff --quiet -- mazduino-tuner/generated; then
            echo "::warning::The latest nightly INI changes the menu. Run gen_all_from_gh_pages.sh and commit generated/."
            git --no-pager diff --stat -- mazduino-tuner/generated
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: mazduino-tuner-menu
          path: mazduino-tuner/generated/
