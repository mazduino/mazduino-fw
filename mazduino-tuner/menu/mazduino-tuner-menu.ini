; =============================================================================
; Mazduino Tuner - menu layout
; =============================================================================
; This file ONLY controls menu placement. Page contents (dialogs/tables/curves),
; fields, memory offsets and conditions still come from the built firmware INI.
;
; Same syntax as the TunerStudio [Menu] section:
;   menu           = "Top-level menu title"
;   subMenu        = <id>[, "Label"][, <condition>]
;   groupMenu      = "Group title"
;   groupChildMenu = <id>[, "Label"][, <condition>]
;   subMenu        = std_separator
;   include        = unplaced        ; all INI items not yet placed
;
; Rules:
;   - Empty label -> uses the original INI label (or the dialog title).
;   - Empty condition -> uses the original INI condition (recommended, to
;     stay in sync with upstream rusEFI).
;   - IDs not present in a given board's INI are skipped (the board lacks
;     that feature). Groups/menus that end up empty are hidden automatically.
;   - Each ID may appear only once in this file.
;   - All INI items not listed here go into the "Expert" menu.
;
; Documentation: mazduino-tuner/docs/
; =============================================================================

; -----------------------------------------------------------------------------
